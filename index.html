    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
      window.global = window;
      // In Google AI Studio iframe environment, HMR WebSockets are disabled.
      // Filter out benign Vite HMR reconnection notices to keep the developer console clean.
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event?.reason &&
          (typeof event.reason === 'string' || event.reason.message) &&
          String(event.reason.message || event.reason).includes('WebSocket closed without opened')
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
